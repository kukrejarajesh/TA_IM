[project]
name = "ta-in"
version = "0.1.0"
description = "Python rebuild of TradingAgents v0.7.0 for NSE stocks (paper trading only)"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic",
    "pydantic-settings",
]

[project.scripts]
trace-summary = "ta_in.llm.trace:main"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ta_in"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = [
    "live: tests that hit the network (excluded by default)",
]
