name: Publish reports

# Builds the Quartz site from site/content and deploys it to GitHub Pages.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  QUARTZ_REF: v4.5.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out Quartz (pinned)
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: ${{ env.QUARTZ_REF }}
          path: _quartz
      - name: Overlay our content and config
        run: |
          rm -rf _quartz/content
          cp -r site/content _quartz/content
          cp site/quartz.config.ts site/quartz.layout.ts _quartz/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _quartz/package-lock.json
      - name: Install and build
        working-directory: _quartz
        run: |
          npm ci
          npx quartz build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
