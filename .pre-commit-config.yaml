repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      # Same rule as pre-commit-hooks' check-added-large-files (500 KB), run through the repo's
      # Python because that hook's executable is blocked by Windows Application Control.
      - id: check-large-files
        name: check for added large files
        entry: uv run python scripts/check_large_files.py
        language: system
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]
      - id: feature-list-guard
        name: feature_list.json guard
        entry: uv run python scripts/check_feature_list.py
        language: system
        pass_filenames: false
        files: ^feature_list\.json$
